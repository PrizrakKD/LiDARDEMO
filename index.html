<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiDAR C4D — Live Scan Demo</title>
<style>
  :root{
    --bg:#070b12; --panel:rgba(13,20,33,.85); --border:#233247;
    --cyan:#22aaf0; --cyan-dim:#1a6c9b; --ink:#e8f0f8; --muted:#8aa0b8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"DejaVu Sans Condensed","Barlow Condensed",system-ui,sans-serif;
    overflow:hidden;
  }
  #app{position:fixed;inset:0}
  canvas{display:block}

  .hud{
    position:fixed; top:0; left:0; right:0; z-index:5;
    padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(7,11,18,.7), transparent);
  }
  .title{font-size:22px; letter-spacing:.14em; font-weight:700; text-transform:uppercase}
  .title b{color:var(--cyan)}
  .sub{font-size:12px; letter-spacing:.28em; text-transform:uppercase; color:var(--muted); margin-top:2px}

  /* bottom dock */
  .dock{
    position:fixed; left:50%; transform:translateX(-50%); z-index:6;
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:12px;
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    padding:14px 18px;
    width:min(560px, calc(100vw - 20px));
    max-height:54vh; overflow-y:auto;
  }
  .drow{display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap}
  .drow.spread{justify-content:space-between}
  .grp{display:flex; flex-direction:column; gap:7px}
  .grp.fill{flex:1; min-width:0}
  .grp.fill input[type=range]{width:100%}
  .grp .cap{
    display:flex; justify-content:space-between; gap:12px;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); white-space:nowrap;
  }
  .grp .cap b{color:var(--cyan); font-weight:600; font-variant-numeric:tabular-nums}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:152px; height:3px;
    background:var(--cyan-dim); border-radius:3px; outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:15px; height:15px; border-radius:50%;
    background:var(--cyan); border:2px solid #04121c; cursor:pointer; box-shadow:0 0 8px rgba(34,170,240,.7);
  }
  input[type=range]::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%; background:var(--cyan);
    border:2px solid #04121c; cursor:pointer; box-shadow:0 0 8px rgba(34,170,240,.7);
  }
  .seg{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden}
  .seg button{
    background:transparent; color:var(--muted); border:0; padding:7px 12px;
    font-family:inherit; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    cursor:pointer; transition:background .12s,color .12s; white-space:nowrap;
  }
  .seg button + button{border-left:1px solid var(--border)}
  .seg button.active{background:var(--cyan); color:#04121c; font-weight:700}
  .swatches{display:flex; gap:8px}
  .sw{width:32px; height:24px; border-radius:5px; cursor:pointer; border:2px solid transparent; transition:border-color .15s}
  .sw.active{border-color:var(--ink)}
  .hint{
    position:fixed; z-index:5; right:16px; top:calc(16px + env(safe-area-inset-top,0px));
    font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
    pointer-events:none; text-align:right;
  }
  @media (max-width:600px){
    .hint{display:none}
    .dock{gap:10px 14px; padding:11px 13px}
    input[type=range]{width:132px}
    .title{font-size:18px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
</style>
</head>
<body>
<div id="app"></div>

<div class="hud">
  <div class="title">LiDAR <b>C4D</b></div>
  <div class="sub">Live scan demo · ray-cast from sensor</div>
</div>

<div class="dock">
  <div class="drow spread">
    <div class="grp">
      <div class="cap"><span>View</span></div>
      <div class="seg" id="viewSeg">
        <button data-v="points" class="active">Points</button>
        <button data-v="shading">Shading</button>
      </div>
    </div>
    <div class="grp">
      <div class="cap"><span>Sensor</span></div>
      <div class="seg" id="sensorSeg">
        <button data-s="corner" class="active">Corner</button>
        <button data-s="center">Center 360°</button>
      </div>
    </div>
    <div class="grp">
      <div class="cap"><span>Blend</span></div>
      <div class="seg" id="blendSeg">
        <button data-b="add" class="active">Add</button>
        <button data-b="normal">Normal</button>
      </div>
    </div>
  </div>

  <div class="drow">
    <div class="grp fill">
      <div class="cap"><span>Sensor pos</span><b id="posVal">0%</b></div>
      <input type="range" id="pos" min="0" max="100" value="0">
    </div>
  </div>

  <div class="drow">
    <div class="grp fill">
      <div class="cap"><span>Points</span><b id="ptsVal">8000</b></div>
      <input type="range" id="pts" min="500" max="30000" step="500" value="8000">
    </div>
    <div class="grp fill">
      <div class="cap"><span>Point size</span><b id="sizeVal">2.0</b></div>
      <input type="range" id="size" min="4" max="60" value="20">
    </div>
    <div class="grp fill">
      <div class="cap"><span>Reveal</span><b id="revealVal">100%</b></div>
      <input type="range" id="reveal" min="0" max="100" value="100">
    </div>
  </div>

  <div class="drow">
    <div class="grp">
      <div class="cap"><span>Depth palette</span></div>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="grp fill">
      <div class="cap"><span>Wireframe</span><b id="wireVal">0%</b></div>
      <input type="range" id="wire" min="0" max="100" value="0">
    </div>
  </div>
</div>

<div class="hint">Drag to orbit · Scroll to zoom</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js"
}}
</script>
<script type="module">
import * as THREE from 'three';

/* ---------- renderer / scene / view camera ---------- */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070b12, 0.010);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 600);
camera.position.set(64, 46, 64);

/* ---------- lights (shading view only) ---------- */
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x141c28, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 2.3);
sun.position.set(46, 92, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 4;
sun.shadow.bias = -0.0004;
const sc = sun.shadow.camera;
sc.near = 10; sc.far = 260; sc.left = -90; sc.right = 90; sc.top = 90; sc.bottom = -90;
sc.updateProjectionMatrix();
scene.add(sun);

/* ---------- deterministic RNG ---------- */
let seed = 20260923;
const rand = () => { seed = (seed*1664525 + 1013904223) & 0x7fffffff; return seed/0x7fffffff; };

/* ---------- primitive cube-city ---------- */
const city = new THREE.Group();
scene.add(city);
const targets = [];
const buildings = [];
const bMat = () => new THREE.MeshStandardMaterial({ color:0xe6edf5, roughness:0.95, metalness:0.0, visible:false });

const groundMesh = new THREE.Mesh(
  new THREE.BoxGeometry(110, 1, 110),
  new THREE.MeshStandardMaterial({ color:0x33404f, roughness:1.0, metalness:0.0, visible:false })
);
groundMesh.position.y = -0.5; groundMesh.receiveShadow = true;
city.add(groundMesh); targets.push(groundMesh);

const GRID = 6, STEP = 13;
for (let ix=0; ix<GRID; ix++){
  for (let iz=0; iz<GRID; iz++){
    if (rand() < 0.12) continue;
    const bx = (ix-(GRID-1)/2)*STEP, bz = (iz-(GRID-1)/2)*STEP;
    const stacks = rand()<0.35 ? 2 : 1;
    for (let s=0;s<stacks;s++){
      const w = 5+rand()*4, d = 5+rand()*4, h = 6+rand()*rand()*34;
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), bMat());
      mesh.position.set(bx+(rand()-0.5)*4, h/2, bz+(rand()-0.5)*4);
      mesh.castShadow = true; mesh.receiveShadow = true;
      city.add(mesh); targets.push(mesh); buildings.push(mesh);
    }
  }
}

/* ---------- sensor motion params ---------- */
let maxH = 0;
for (const b of buildings) maxH = Math.max(maxH, b.geometry.parameters.height);
const cornerGeo = { R: Math.hypot(58,58), height: 44, theta0: Math.atan2(58,58) };
let sensorPos = 0;

/* ---------- two LiDAR sensors ---------- */
const SENSORS = {
  corner: { origin: new THREE.Vector3(58, 44, 58), mode:'cone' },
  center: { origin: new THREE.Vector3(0, 12, 0),  mode:'sphere' },
};
let active = 'corner';

/* ---------- rotating wireframe-octahedron sensor marker ---------- */
function makeMarker(pos){
  const g = new THREE.Group(); g.position.copy(pos);
  const spin = new THREE.Group();
  // soft additive core
  spin.add(new THREE.Mesh(
    new THREE.OctahedronGeometry(1.5),
    new THREE.MeshBasicMaterial({ color:0x22aaf0, transparent:true, opacity:0.28, blending:THREE.AdditiveBlending, depthWrite:false })
  ));
  // bright wireframe edges
  spin.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.OctahedronGeometry(2.5)),
    new THREE.LineBasicMaterial({ color:0x6fdcff, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false })
  ));
  g.add(spin); g.userData = { spin };
  scene.add(g); return g;
}
const markers = { corner: makeMarker(SENSORS.corner.origin), center: makeMarker(SENSORS.center.origin) };

/* ---------- wireframe edge overlay of the city (opacity via slider) ---------- */
const wireGroup = new THREE.Group(); scene.add(wireGroup);
const wireMat = new THREE.LineBasicMaterial({ color:0xafe0ff, transparent:true, opacity:0.0, depthWrite:false });
for (const b of buildings){
  const ls = new THREE.LineSegments(new THREE.EdgesGeometry(b.geometry), wireMat);
  ls.position.copy(b.position); wireGroup.add(ls);
}
wireGroup.visible = false;

/* ---------- ray-cast sampling ---------- */
const raycaster = new THREE.Raycaster();
const _dir = new THREE.Vector3(), _tgt = new THREE.Vector3();
const AIM_MIN = new THREE.Vector3(-46, 0, -46);
const AIM_MAX = new THREE.Vector3( 46, 40,  46);

function genDir(cfg){
  if (cfg.mode === 'cone'){
    _tgt.set(
      AIM_MIN.x + rand()*(AIM_MAX.x-AIM_MIN.x),
      AIM_MIN.y + rand()*(AIM_MAX.y-AIM_MIN.y),
      AIM_MIN.z + rand()*(AIM_MAX.z-AIM_MIN.z)
    );
    return _dir.copy(_tgt).sub(cfg.origin).normalize();
  } else {
    const z = 1 - 2*rand();
    const r = Math.sqrt(Math.max(0, 1 - z*z));
    const a = 2*Math.PI*rand();
    return _dir.set(r*Math.cos(a), z, r*Math.sin(a));
  }
}

let cloud, material, rayLines, raySegCount = 0;
let geometry = new THREE.BufferGeometry();

function sampleCloud(nRays){
  const cfg = SENSORS[active];
  seed = 987654321 ^ (nRays * 131) ^ (active==='center'?7777:0);
  const pos = [];
  for (let i=0;i<nRays;i++){
    genDir(cfg);
    raycaster.set(cfg.origin, _dir);
    const hit = raycaster.intersectObjects(targets, false);
    if (hit.length){ const p = hit[0].point; pos.push(p.x, p.y, p.z); }
  }
  const n = pos.length/3;
  const arr = new Float32Array(pos);
  const rnd = new Float32Array(n);
  for (let i=0;i<n;i++) rnd[i]=rand();

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(arr,3));
  geo.setAttribute('arand',    new THREE.BufferAttribute(rnd,1));
  geo.computeBoundingSphere();
  if (cloud){ cloud.geometry.dispose(); cloud.geometry = geo; }
  geometry = geo;

  buildRayLines(cfg.origin, arr, rnd, n);
  updateRayReveal(uniforms.uReveal.value);
}

// rays sorted by per-point reveal threshold, so Reveal thins them the same way it thins points
function buildRayLines(origin, arr, rnd, n){
  const MAXL = 64, step = Math.max(1, Math.floor(n/MAXL));
  const picked = [];
  for (let i=0;i<n;i+=step) picked.push({ a:rnd[i], i });
  picked.sort((p,q)=>p.a-q.a);
  const seg = [];
  for (const {i} of picked) seg.push(origin.x,origin.y,origin.z, arr[i*3],arr[i*3+1],arr[i*3+2]);
  raySegCount = picked.length;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(seg),3));
  if (rayLines){ rayLines.geometry.dispose(); rayLines.geometry = g; }
  else {
    rayLines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({
      color:0x22aaf0, transparent:true, opacity:0.16, blending:THREE.AdditiveBlending, depthWrite:false
    }));
    scene.add(rayLines);
  }
}
function updateRayReveal(rev){
  if (!rayLines) return;
  const vis = Math.floor(rev * raySegCount);
  rayLines.geometry.setDrawRange(0, vis*2);   // 2 verts per segment
}

/* ---------- depth-colored point material (distance to active sensor) ---------- */
const palettes = [
  { name:'cyan',   near:[0x22/255,0xd0/255,0xff/255], far:[0x0a/255,0x1e/255,0x4a/255] },
  { name:'thermal',near:[0xff/255,0xe0/255,0x4d/255], far:[0x7a/255,0x00/255,0x4d/255] },
  { name:'green',  near:[0x9d/255,0xff/255,0x57/255], far:[0x04/255,0x2a/255,0x1e/255] },
  { name:'ice',    near:[0xff/255,0xff/255,0xff/255], far:[0x1a/255,0x4a/255,0x8a/255] },
];
let pal = palettes[0];

const uniforms = {
  uSize:{value:2.0}, uReveal:{value:1.0},
  uNear:{value:new THREE.Vector3(...pal.near)}, uFar:{value:new THREE.Vector3(...pal.far)},
  uSensor:{value:SENSORS[active].origin.clone()},
  uDMin:{value:16.0}, uDMax:{value:135.0}, uFeather:{value:1.0},
  uPixelRatio:{value:renderer.getPixelRatio()},
};

material = new THREE.ShaderMaterial({
  uniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uSize; uniform float uReveal; uniform float uPixelRatio;
    uniform float uDMin; uniform float uDMax; uniform vec3 uSensor;
    attribute float arand; varying float vDepth; varying float vShow;
    void main(){
      float range = distance(position, uSensor);
      vDepth = clamp((range-uDMin)/(uDMax-uDMin), 0.0, 1.0);
      vShow = step(arand, uReveal);
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = uSize * (300.0/max(-mv.z,1.0)) * uPixelRatio * vShow;
    }
  `,
  fragmentShader:`
    precision mediump float; uniform vec3 uNear; uniform vec3 uFar; uniform float uFeather;
    varying float vDepth; varying float vShow;
    void main(){
      if (vShow < 0.5) discard;
      vec2 c = gl_PointCoord - vec2(0.5); float r = dot(c,c);
      if (r > 0.25) discard;
      float alpha = uFeather > 0.5 ? smoothstep(0.25,0.02,r) : 1.0;
      gl_FragColor = vec4(mix(uNear,uFar,vDepth), alpha);
    }
  `,
});

cloud = new THREE.Points(geometry, material);
scene.add(cloud);

/* ---------- view / sensor / blend state ---------- */
let view = 'points';
let blend = 'add';
function applyBlend(){
  if (blend==='add'){ material.blending=THREE.AdditiveBlending; material.depthWrite=false; uniforms.uFeather.value=1.0; }
  else { material.blending=THREE.NormalBlending; material.depthWrite=true; uniforms.uFeather.value=0.0; }
  material.needsUpdate = true;
}
function applyView(){
  const shading = view==='shading';
  buildings.forEach(m=> m.material.visible = shading);
  groundMesh.material.visible = shading;
  cloud.visible = !shading;
  rayLines.visible = !shading;
}
function applySensorMarkers(){
  markers.corner.visible = active==='corner';
  markers.center.visible = active==='center';
}
function positionSensor(){
  const o = SENSORS[active].origin;
  if (active==='corner'){
    const th = cornerGeo.theta0 + sensorPos*Math.PI;
    o.set(cornerGeo.R*Math.sin(th), cornerGeo.height, cornerGeo.R*Math.cos(th));
  } else {
    o.set(0, 2 + sensorPos*(maxH-2), 0);
  }
  markers[active].position.copy(o);
  uniforms.uSensor.value.copy(o);
}

positionSensor();
applyBlend();
sampleCloud(8000);
applyView();
applySensorMarkers();

/* ---------- minimal orbit controls ---------- */
const target = new THREE.Vector3(0, 9, 0);
let radius = camera.position.distanceTo(target);
let theta = Math.atan2(camera.position.x - target.x, camera.position.z - target.z);
let phi = Math.acos((camera.position.y - target.y)/radius);
let autoSpin = true;
function applyCam(){
  phi = Math.max(0.2, Math.min(Math.PI/2 - 0.02, phi));
  radius = Math.max(28, Math.min(240, radius));
  camera.position.set(
    target.x + radius*Math.sin(phi)*Math.sin(theta),
    target.y + radius*Math.cos(phi),
    target.z + radius*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(target);
}
applyCam();
let dragging=false, px=0, py=0;
const dom = renderer.domElement;
const down=(x,y)=>{dragging=true;autoSpin=false;px=x;py=y;};
const move=(x,y)=>{ if(!dragging)return; theta-=(x-px)*0.006; phi-=(y-py)*0.006; px=x;py=y; applyCam(); };
const up=()=>{dragging=false;};
dom.addEventListener('mousedown', e=>down(e.clientX,e.clientY));
addEventListener('mousemove', e=>move(e.clientX,e.clientY));
addEventListener('mouseup', up);
dom.addEventListener('touchstart', e=>{ if(e.touches[0]) down(e.touches[0].clientX,e.touches[0].clientY); }, {passive:true});
dom.addEventListener('touchmove', e=>{ if(e.touches[0]) move(e.touches[0].clientX,e.touches[0].clientY); }, {passive:true});
dom.addEventListener('touchend', up);
dom.addEventListener('wheel', e=>{ e.preventDefault(); autoSpin=false; radius*=(1+Math.sign(e.deltaY)*0.08); applyCam(); }, {passive:false});

/* ---------- UI ---------- */
const viewSeg = document.getElementById('viewSeg');
viewSeg.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  view = b.dataset.v;
  [...viewSeg.children].forEach(c=>c.classList.toggle('active', c===b));
  applyView();
});
const sensorSeg = document.getElementById('sensorSeg');
sensorSeg.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  active = b.dataset.s;
  [...sensorSeg.children].forEach(c=>c.classList.toggle('active', c===b));
  positionSensor();
  applySensorMarkers();
  sampleCloud(+ptsEl.value);
});
const blendSeg = document.getElementById('blendSeg');
blendSeg.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  blend = b.dataset.b;
  [...blendSeg.children].forEach(c=>c.classList.toggle('active', c===b));
  applyBlend();
});

const ptsEl=document.getElementById('pts'), ptsVal=document.getElementById('ptsVal');
let resampleTimer=null;
ptsEl.addEventListener('input', ()=>{
  ptsVal.textContent = ptsEl.value;
  clearTimeout(resampleTimer);
  resampleTimer = setTimeout(()=> sampleCloud(+ptsEl.value), 110);
});
const posEl=document.getElementById('pos'), posVal=document.getElementById('posVal');
posEl.addEventListener('input', ()=>{
  sensorPos = posEl.value/100; posVal.textContent = posEl.value+'%';
  positionSensor();
  clearTimeout(resampleTimer);
  resampleTimer = setTimeout(()=> sampleCloud(+ptsEl.value), 110);
});
const revealEl=document.getElementById('reveal'), revealVal=document.getElementById('revealVal');
revealEl.addEventListener('input', ()=>{
  uniforms.uReveal.value = revealEl.value/100;
  revealVal.textContent = revealEl.value+'%';
  updateRayReveal(uniforms.uReveal.value);       // thin the rays with the points
});
const sizeEl=document.getElementById('size'), sizeVal=document.getElementById('sizeVal');
const syncSize=()=>{ uniforms.uSize.value=sizeEl.value/10; sizeVal.textContent=(sizeEl.value/10).toFixed(1); };
sizeEl.addEventListener('input', syncSize); syncSize();
const swWrap=document.getElementById('swatches');
palettes.forEach((p,i)=>{
  const el=document.createElement('div'); el.className='sw'+(i===0?' active':'');
  const hex=a=>'#'+a.map(v=>('0'+Math.round(v*255).toString(16)).slice(-2)).join('');
  el.style.background=`linear-gradient(90deg, ${hex(p.near)}, ${hex(p.far)})`; el.title=p.name;
  el.addEventListener('click', ()=>{
    pal=p; uniforms.uNear.value.set(...p.near); uniforms.uFar.value.set(...p.far);
    [...swWrap.children].forEach(c=>c.classList.remove('active')); el.classList.add('active');
  });
  swWrap.appendChild(el);
});

const wireEl=document.getElementById('wire'), wireVal=document.getElementById('wireVal');
wireEl.addEventListener('input', ()=>{
  const o = wireEl.value/100;
  wireMat.opacity = o; wireGroup.visible = o > 0.001;
  wireVal.textContent = wireEl.value+'%';
});

/* ---------- resize ---------- */
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); uniforms.uPixelRatio.value=renderer.getPixelRatio();
});

/* ---------- loop ---------- */
let t=0;
function tick(){
  t+=0.016;
  if (autoSpin){ theta+=0.0015; applyCam(); }
  const m = markers[active];
  if (m){ m.userData.spin.rotation.y += 0.03; m.userData.spin.rotation.x += 0.012; }
  if (rayLines && rayLines.visible) rayLines.material.opacity = 0.11 + Math.sin(t*2.0)*0.05;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
